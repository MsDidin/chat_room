<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聊天室</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 登录界面 -->
    <div id="login-container" class="container">
        <div class="login-box">
            <h1>欢迎来到聊天室</h1>
            <input type="text" id="username-input" placeholder="请输入你的昵称" maxlength="20" autocomplete="off">
            <button id="join-btn">加入聊天室</button>
        </div>
    </div>

    <!-- 聊天界面 -->
    <div id="chat-container" class="container hidden">
        <div class="chat-wrapper">
            <!-- 侧边栏 - 在线用户 -->
            <div class="sidebar">
                <div class="sidebar-header">
                    <h3>在线用户</h3>
                    <span id="user-count" class="user-count">0</span>
                </div>
                <ul id="online-users-list" class="users-list"></ul>
            </div>

            <!-- 主聊天区域 -->
            <div class="chat-main">
                <div class="chat-header">
                    <h2>聊天室</h2>
                    <span id="current-username" class="current-user"></span>
                </div>

                <div id="messages-container" class="messages-container"></div>

                <div id="typing-indicator" class="typing-indicator hidden">
                    <span class="typing-text"></span>
                </div>

                <div class="input-container">
                    <input type="text" id="message-input" placeholder="输入消息..." autocomplete="off" disabled>
                    <button id="send-btn" disabled>发送</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="app.js"></script>
</body>
</html>
